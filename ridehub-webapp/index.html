<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RideHub — Premium showcase for bicycles, electric scooters, and motorcycles." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>RideHub — Premium Vehicle Showcase</title>
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.classList.add(theme)
      })()
    </script>
    <div id="root">
      <p style="margin:0;padding:2rem;font-family:system-ui,sans-serif;text-align:center;color:#64748b">
        Loading RideHub…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
